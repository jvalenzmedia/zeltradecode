<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: transparent;
    font-family: 'Segoe UI', sans-serif;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    height: 100vh;
    padding-right: 50px;
    pointer-events: none;
  }

  #ui {
    display: none;
    pointer-events: all;
    width: 300px;
    height: 400px;
    background: rgba(10, 10, 20, 0.75);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    overflow: hidden;
    flex-direction: column;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }

  #ui.open {
    display: flex;
  }

  /* BANNER */
  #banner {
    width: 100%;
    height: 110px;
    background: linear-gradient(135deg, #7c3aed, #a855f7);
    position: relative;
    flex-shrink: 0;
  }

  #banner img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  #banner-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(10,10,20,0.7), transparent);
    display: flex;
    align-items: flex-end;
    padding: 10px 14px;
  }

  #server-name {
    font-size: .9rem;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 1px 4px rgba(0,0,0,0.8);
  }

  /* CLOSE */
  #close-btn {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 24px;
    height: 24px;
    background: rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 50%;
    color: #fff;
    font-size: .75rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .15s;
  }

  #close-btn:hover { background: rgba(239,68,68,0.6); }

  /* BODY */
  .ui-body {
    flex: 1;
    padding: 18px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .ui-title {
    font-size: .8rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: #a855f7;
  }

  .ui-desc {
    font-size: .75rem;
    color: #888;
    line-height: 1.5;
  }

  #code-input {
    width: 100%;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 10px 12px;
    color: #e2e2f0;
    font-size: .9rem;
    font-family: monospace;
    outline: none;
    transition: border-color .2s;
    text-transform: uppercase;
  }

  #code-input:focus { border-color: #7c3aed; }
  #code-input::placeholder { color: #444; text-transform: none; }

  #redeem-btn {
    width: 100%;
    padding: 11px;
    background: linear-gradient(135deg, #7c3aed, #a855f7);
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: .875rem;
    font-weight: 700;
    cursor: pointer;
    transition: opacity .2s;
  }

  #redeem-btn:hover { opacity: .85; }
  #redeem-btn:disabled { opacity: .5; cursor: not-allowed; }

  #result {
    font-size: .78rem;
    text-align: center;
    min-height: 18px;
    line-height: 1.4;
  }

  .result-success { color: #86efac; }
  .result-error   { color: #fca5a5; }

  /* FOOTER */
  .ui-footer {
    padding: 8px;
    text-align: center;
    font-size: .62rem;
    color: #444;
    border-top: 1px solid rgba(255,255,255,0.05);
    flex-shrink: 0;
  }

  .ui-footer span { color: #7c3aed; }
</style>
</head>
<body>

<div id="ui">
  <div id="banner">
    <img id="banner-img" src="" alt="">
    <div id="banner-overlay">
      <div id="server-name"></div>
    </div>
    <div id="close-btn" onclick="closeUI()">✕</div>
  </div>

  <div class="ui-body">
    <div class="ui-title">🎁 Canjear código</div>
    <div class="ui-desc">Ingresa tu código de compra para recibir tu recompensa en el servidor.</div>

    <input id="code-input" type="text" placeholder="ZELT-XXXX-XXXX" maxlength="30">

    <button id="redeem-btn" onclick="redeem()">Canjear →</button>

    <div id="result"></div>
  </div>

  <div class="ui-footer">Powered by <span>JVL MediaCode</span></div>
</div>

<script>
  const ui       = document.getElementById('ui');
  const input    = document.getElementById('code-input');
  const result   = document.getElementById('result');
  const btn      = document.getElementById('redeem-btn');
  const bannerImg = document.getElementById('banner-img');
  const serverName = document.getElementById('server-name');

  window.addEventListener('message', function(e) {
    if (e.data.action === 'open') {
      serverName.textContent = e.data.serverName || '';
      if (e.data.serverBanner) {
        bannerImg.src = e.data.serverBanner;
        bannerImg.style.display = 'block';
      } else {
        bannerImg.style.display = 'none';
      }
      input.value = '';
      result.textContent = '';
      result.className = '';
      ui.classList.add('open');
      setTimeout(() => input.focus(), 100);
    }
    if (e.data.action === 'close') {
      ui.classList.remove('open');
    }
    if (e.data.action === 'result') {
      btn.disabled = false;
      btn.textContent = 'Canjear →';
      result.textContent = e.data.msg;
      result.className = e.data.success ? 'result-success' : 'result-error';
    }
  });

  function closeUI() {
    ui.classList.remove('open');
    fetch('https://zeltradecode/closeUI', { method: 'POST' });
  }

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeUI();
  });

  function redeem() {
    const code = input.value.trim();
    if (!code) return;
    btn.disabled = true;
    btn.textContent = '⏳ Canjeando...';
    result.textContent = '';
    fetch('https://zeltradecode/redeem', {
      method: 'POST',
      body: JSON.stringify({ code })
    });
  }
</script>
</body>
</html>
